<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Echo gastfeedback</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0e161b">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="echo.css">
<style>
/* Gastscherm: één kolom, duim-hoogte, geen scroll nodig voor stap 1. */
.g{max-width:520px;margin:0 auto;padding-block:18px calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;min-height:100vh;min-height:100dvh}
.g-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.g-zaak{font:700 20px/1.1 var(--display);color:var(--fg)}
.taal{display:flex;gap:2px}
.taal button{background:none;border:1px solid transparent;color:var(--muted);font:600 13px var(--body);letter-spacing:.06em;padding:6px 8px;border-radius:8px;cursor:pointer}
.taal button.on{color:var(--fg);border-color:var(--line);background:var(--surface)}
.g h1{font-size:clamp(34px,9vw,44px)}
.g .sub{color:var(--muted);margin-top:8px}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--body);cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.face svg{width:100%;max-width:52px;height:auto}
.face:active{transform:scale(.96)}
.face[aria-pressed="true"]{border-color:var(--k);background:color-mix(in srgb,var(--k) 14%,var(--surface));color:var(--fg)}
.faces.gekozen .face:not([aria-pressed="true"]){opacity:.45}
.stap{display:flex;flex-direction:column;gap:20px;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.blok{display:grid;gap:10px}
.blok h2{font-size:24px}
.blok .hint{color:var(--dim);font-size:14px;margin-top:-4px}
.contact{padding:14px;display:grid;gap:12px}
.contact .rij{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.contact .rij{grid-template-columns:1fr}}
.verstuur{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.verstuur .btn{width:100%;box-shadow:0 14px 30px -12px rgba(0,0,0,.8)}
.fout{color:#ffb4b4;font-size:15px}
.klaar{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:8vh}
.klaar svg{width:84px;height:84px}
.klaar .review{margin-top:18px;padding:18px;display:grid;gap:12px;justify-items:center;width:100%}
.voet{margin-top:auto;display:flex;justify-content:center;color:var(--dim);font-size:12.5px;gap:8px;align-items:center}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div class="demo-bar" id="demo" hidden>Demo: je feedback blijft in deze browser. <a href="zaak.html" id="demo-link" style="color:inherit">Bekijk het overzicht van de zaak</a> (pincode 0000).</div>
<main class="g">
  <div class="g-top">
    <span class="g-zaak" id="zaak">&nbsp;</span>
    <div class="taal" id="taal" role="group" aria-label="Taal"></div>
  </div>

  <section id="s1" class="stap">
    <div>
      <h1 id="t-vraag">Hoe was je bezoek?</h1>
      <p class="sub" id="t-sub">Tik een gezicht. Klaar in een halve minuut.</p>
    </div>
    <div class="faces" id="faces" role="group" aria-labelledby="t-vraag"></div>
  </section>

  <form id="s2" class="stap" hidden novalidate>
    <div class="blok">
      <h2 id="t-tags">Wat was top?</h2>
      <p class="hint" id="t-opt">Optioneel, tik wat van toepassing is</p>
      <div class="chips" id="tags"></div>
    </div>
    <div class="blok" id="tafel-blok" hidden>
      <label class="f" for="tafel"><span id="t-tafel" style="font:700 24px var(--display);color:var(--fg)">Aan welke tafel zat je?</span></label>
      <input id="tafel" inputmode="numeric" maxlength="10" autocomplete="off" style="max-width:220px">
    </div>
    <div class="blok">
      <label class="f" for="opm"><span id="t-opm" style="font:700 24px var(--display);color:var(--fg)">Wil je nog iets kwijt?</span></label>
      <textarea id="opm" maxlength="1000" rows="3"></textarea>
    </div>
    <div class="card contact" id="contact" hidden>
      <button type="button" class="chip" id="contact-ja" aria-pressed="false"><span id="t-contact">Mogen we contact met je opnemen?</span></button>
      <div class="rij" id="contact-velden" hidden>
        <label class="f" for="c-naam"><span id="t-naam">Naam</span><input id="c-naam" autocomplete="name" maxlength="100"></label>
        <label class="f" for="c-tel"><span id="t-tel">Telefoon of e-mail</span><input id="c-tel" autocomplete="tel" maxlength="100" inputmode="email"></label>
      </div>
    </div>
    <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off"></div>
    <div class="verstuur">
      <p class="fout" id="fout" hidden></p>
      <button class="btn btn-primary" id="knop" type="submit">Versturen</button>
    </div>
  </form>

  <section id="s3" class="klaar" hidden aria-live="polite">
    <div id="klaar-face"></div>
    <h1 id="t-bedankt">Dank je wel!</h1>
    <p class="sub" id="t-bedankt-sub"></p>
    <div class="card review" id="review" hidden>
      <p id="t-review"></p>
      <a class="btn btn-ghost" id="review-link" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <footer class="voet"><span class="wm"><img src="img/icon.png" alt=""><span class="wm-s"></span><span class="wm-t"><b>ROBOSHIFT</b><small>SHIFT HAPPENS</small></span></span><span id="t-door">Echo</span></footer>
</main>

<script src="config.js"></script>
<script type="module">
import { api, isDemo, gezicht } from "./api.js";
import { TEKST, SCORE_KLEUR } from "./defaults.js";

const q = new URLSearchParams(location.search);
const zaakId = (q.get("z") || "kwikkel").toLowerCase();
const bron = (q.get("b") || "viltje").slice(0, 20);
const tafelUitLink = (q.get("t") || "").slice(0, 10);
const $ = id => document.getElementById(id);

let S = null, taal = "nl", score = 0, verstuurd = false;
const gekozen = new Set();

function kiesTaal() {
  const voorkeur = (q.get("lang") || navigator.language || "nl").slice(0, 2);
  return S.talen.includes(voorkeur) ? voorkeur : S.talen[0];
}

function tekst() {
  const T = TEKST[taal];
  document.documentElement.lang = taal;
  $("t-vraag").textContent = T.vraag; $("t-sub").textContent = T.sub;
  $("t-opt").textContent = T.optioneel; $("t-opm").textContent = T.opmerking;
  $("opm").placeholder = T.opmerkingPh; $("t-contact").textContent = T.contact;
  $("t-naam").textContent = T.naam; $("t-tel").textContent = T.tel;
  $("t-tafel").textContent = T.tafel; $("tafel").placeholder = T.tafelPh;
  $("knop").textContent = T.verstuur; $("t-door").textContent = T.door;
  $("taal").innerHTML = S.talen.length > 1 ? S.talen.map(t => `<button type="button" data-t="${t}" class="${t === taal ? "on" : ""}">${t.toUpperCase()}</button>`).join("") : "";
  $("faces").innerHTML = [1, 2, 3, 4, 5].map(n =>
    `<button type="button" class="face" data-s="${n}" style="--k:${SCORE_KLEUR[n - 1]}" aria-pressed="${n === score}">${gezicht(n, SCORE_KLEUR[n - 1])}<span>${T.scores[n - 1]}</span></button>`).join("");
  if (score) tags();
}

function tags() {
  const T = TEKST[taal];
  const laag = score <= 3;
  $("t-tags").textContent = laag ? T.beter : T.top;
  $("tags").innerHTML = S.onderdelen.map(o => {
    const sleutel = o.nl; const label = o[taal] || o.nl;
    return `<button type="button" class="chip" data-k="${esc(sleutel)}" aria-pressed="${gekozen.has(sleutel)}">${esc(label)}</button>`;
  }).join("");
  $("contact").hidden = !(S.contactVragen && score <= S.drempelSlecht);
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

$("taal").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  taal = b.dataset.t; tekst();
});

$("faces").addEventListener("click", e => {
  const b = e.target.closest(".face"); if (!b) return;
  const nieuw = +b.dataset.s;
  if ((nieuw <= 3) !== (score <= 3)) gekozen.clear(); // andere vraag, andere tags
  score = nieuw;
  $("faces").classList.add("gekozen");
  [...$("faces").children].forEach(f => f.setAttribute("aria-pressed", +f.dataset.s === score));
  tags();
  const eerste = $("s2").hidden;
  $("s2").hidden = false;
  if (eerste) setTimeout(() => $("s2").scrollIntoView({ behavior: "smooth", block: "start" }), 60);
});

$("tags").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const k = b.dataset.k;
  gekozen.has(k) ? gekozen.delete(k) : gekozen.add(k);
  b.setAttribute("aria-pressed", gekozen.has(k));
});

$("contact-ja").addEventListener("click", () => {
  const aan = $("contact-ja").getAttribute("aria-pressed") !== "true";
  $("contact-ja").setAttribute("aria-pressed", aan);
  $("contact-velden").hidden = !aan;
  if (aan) $("c-naam").focus();
});

function pakket() {
  const contactAan = !$("contact").hidden && $("contact-ja").getAttribute("aria-pressed") === "true";
  const contact = contactAan && ($("c-naam").value.trim() || $("c-tel").value.trim())
    ? { naam: $("c-naam").value.trim(), tel: $("c-tel").value.trim() } : null;
  const tafel = tafelUitLink || $("tafel").value.trim().slice(0, 10);
  return { score, bron, tafel, taal, tags: [...gekozen], opmerking: $("opm").value.trim(), contact, website: $("website").value };
}

$("s2").addEventListener("submit", async e => {
  e.preventDefault();
  if (!score || verstuurd) return;
  $("knop").disabled = true; $("fout").hidden = true;
  try {
    await api.stuur(zaakId, pakket());
    verstuurd = true; klaar();
  } catch (err) {
    $("fout").textContent = TEKST[taal].fout; $("fout").hidden = false;
  } finally { $("knop").disabled = false; }
});

// Gast tikt een gezicht en sluit de pagina zonder te versturen: score toch meesturen.
addEventListener("pagehide", () => {
  if (!score || verstuurd || isDemo()) return;
  verstuurd = api.baken({ ...pakket(), onvolledig: true });
});

function klaar() {
  const T = TEKST[taal];
  $("s1").hidden = true; $("s2").hidden = true; $("s3").hidden = false;
  $("klaar-face").innerHTML = gezicht(score, SCORE_KLEUR[score - 1]);
  $("t-bedankt").textContent = T.bedankt;
  $("t-bedankt-sub").textContent = score <= S.drempelSlecht ? T.bedanktLaag : T.bedanktSub;
  if (S.reviewAan && /^https:\/\//.test(S.reviewLink)) {
    $("review").hidden = false; $("t-review").textContent = T.review;
    $("review-link").textContent = T.reviewKnop; $("review-link").href = S.reviewLink;
  }
  scrollTo({ top: 0 });
}

(async () => {
  try { S = await api.zaak(zaakId); }
  catch (e) { document.querySelector("main").innerHTML = '<p style="padding-top:20vh;text-align:center;color:var(--muted)">Deze feedbackpagina bestaat niet (meer).</p>'; return; }
  $("zaak").textContent = S.naam;
  document.title = S.naam + " · feedback";
  taal = kiesTaal(); tekst();
  $("tafel-blok").hidden = !(S.vraagTafel && !tafelUitLink && (S.tafelBronnen || []).includes(bron));
  if (isDemo()) { $("demo").hidden = false; $("demo-link").href = "zaak.html?demo&z=" + encodeURIComponent(zaakId); }
})();
</script>
</body>
</html>
